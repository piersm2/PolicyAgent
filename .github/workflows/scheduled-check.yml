# Wakes the codespace once a day and checks watched payer pages that are due.
# A codespace stops after ~30 idle minutes, which also stops the app's own
# hourly timer; this starts it over SSH, runs `npm run check-due`, and lets it
# go back to sleep. Setup (one time) is in the README under "Scheduled checks".
name: Scheduled payer check

on:
  schedule:
    - cron: "17 12 * * *" # 12:17 UTC daily = 7:17 AM Central (6:17 AM in winter)
  workflow_dispatch:

jobs:
  check:
    # Skipped (not failed) until the CODESPACE_NAME variable is set.
    if: vars.CODESPACE_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check setup
        env:
          TOKEN: ${{ secrets.CODESPACE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the CODESPACE_TOKEN secret (README → Scheduled checks)."
            exit 1
          fi

      - name: Wake the codespace and run due checks
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
          CODESPACE: ${{ vars.CODESPACE_NAME }}
          REPO_DIR: /workspaces/${{ github.event.repository.name }}
        run: |
          # Starting a stopped codespace can take a minute or two; retry once.
          for attempt in 1 2; do
            if gh codespace ssh -c "$CODESPACE" -- "cd $REPO_DIR && npm run --silent check-due"; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          exit 1
